name: Build experimental S31 base

on:
  workflow_dispatch:
    inputs:
      envelope_release_tag:
        description: toit-envelopes release tag containing alpha.esp32s31 assets
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download matching S31 envelope and SDK
        env:
          ENVELOPE_RELEASE_TAG: ${{ inputs.envelope_release_tag }}
        run: |
          if [[ ! "$ENVELOPE_RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::envelope_release_tag must be a release tag using letters, digits, dots, underscores or hyphens."
            exit 1
          fi
          mkdir -p build/s31-input
          cd build/s31-input
          BASE_URL="https://github.com/lightbug-io/toit-envelopes/releases/download/$ENVELOPE_RELEASE_TAG"
          for asset in alpha.esp32s31-single-ota-4mb.envelope \
            alpha.esp32s31-sdk-linux-x64.tar.gz alpha.esp32s31-build.json \
            alpha.esp32s31-SHA256SUMS; do
            curl --fail --location --retry 3 --output "$asset" "$BASE_URL/$asset"
          done
          sha256sum --check alpha.esp32s31-SHA256SUMS
          jq -e '.experimental == true and .variant == "esp32s31-single-ota-4mb"
            and .asset == "alpha.esp32s31-single-ota-4mb.envelope"
            and .toit_repository == "addshore/toit"
            and (.toit_ref | test("^[0-9a-f]{40}$"))' alpha.esp32s31-build.json

      - name: Set up matching experimental Toit SDK
        run: |
          mkdir -p build/s31-sdk
          tar -xzf build/s31-input/alpha.esp32s31-sdk-linux-x64.tar.gz -C build/s31-sdk
          echo "$GITHUB_WORKSPACE/build/s31-sdk/sdk/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          toit version
          toit pkg install
          cd examples
          toit pkg install

      - name: Build existing base app for S31
        env:
          LIGHTBUG_ENVELOPE_FILE: build/s31-input/alpha.esp32s31-single-ota-4mb.envelope
          LIGHTBUG_FIRMWARE_VARIANT: base
          LIGHTBUG_FIRMWARE_VERSION: 0.0.0
        run: |
          TOIT_REF=$(jq -r '.toit_ref' build/s31-input/alpha.esp32s31-build.json)
          bash build/build.sh base.s31 ./examples/containers/base.toit "$TOIT_REF" esp32s31
          cp build/s31-input/alpha.esp32s31-build.json build/out/base.s31/

      - name: Validate full 4 MiB S31 flash image
        run: |
          python3 - <<'PY'
          from pathlib import Path

          image = Path("build/out/base.s31/base.s31.image.bin").read_bytes()
          if len(image) != 4 * 1024 * 1024:
              raise SystemExit(f"Expected a 4 MiB image, got {len(image)} bytes")
          # S31 boots at 0x2000; the single OTA slot is aligned to 0x10000.
          for name, offset in [("bootloader", 0x2000), ("application", 0x10000)]:
              if image[offset] != 0xE9:
                  raise SystemExit(f"Missing ESP image header for {name}")
              chip_id = int.from_bytes(image[offset + 12:offset + 14], "little")
              if chip_id != 0x20:
                  raise SystemExit(f"Expected ESP32-S31 {name}, got chip ID {chip_id}")
              if image[offset + 3] >> 4 != 2:
                  raise SystemExit(f"Expected 4 MiB flash header for {name}")
          print("Validated 4 MiB ESP32-S31 image including bootloader and application")
          PY
          cd build/out/base.s31
          sha256sum *.snapshot *.envelope *.bin alpha.esp32s31-build.json > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: base-s31-4mb-artifacts
          path: build/out/base.s31/
          if-no-files-found: error
