name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      snapshot_name:
        description: 'Snapshot Name'
        required: true
        default: 'custom-app'
      target_file:
        description: 'Target Toit File'
        required: true
        default: 'examples/geofence.toit'
      toit_version:
        description: 'Toit Version'
        required: true
        default: 'v2.0.0-alpha.198'
      firmware_type:
        description: 'Firmware Type'
        required: true
        default: 'esp32c6'
      firmware_version:
        description: 'Firmware semver to embed (for example 0.18.0)'
        required: true
        default: '0.0.0'
      lightbug_envelope_release_tag:
        description: 'Lightbug envelope GitHub release tag'
        required: true
        default: 'lb.20260819-1'
      lightbug_envelope_asset:
        description: 'Envelope asset name in that release'
        required: true
        default: 'esp32c6-single-ota.198.envelope'
      lightbug_envelope_url:
        description: 'Optional full URL to download a custom envelope'
        required: false
        default: ''

# Only superseded runs for the same pull request may cancel each other.
# Give push, tag, and manual runs unique groups so they remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Tests / Toit ${{ matrix.toit_version }}
    runs-on: ubuntu-latest
    # Keep this matrix even with one version so future SDK versions are easy to add.
    strategy:
      matrix:
        toit_version:
          - v2.0.0-alpha.198
    steps:
      - uses: actions/checkout@v7
      - uses: toitlang/action-setup@v1.5.0
        with:
          toit-version: ${{ matrix.toit_version }}
      - run: make test
      - name: Analyze examples
        run: make analyze-examples TOIT=toit TOIT_PKG="toit pkg"

  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Construct JSON for manual dispatch
            MATRIX_JSON=$(jq -n -c \
              --arg name "${{ inputs.snapshot_name }}" \
              --arg path "${{ inputs.target_file }}" \
              --arg version "${{ inputs.toit_version }}" \
              --arg chip "${{ inputs.firmware_type }}" \
              --arg firmwareVersion "${{ inputs.firmware_version }}" \
              --arg envelopeReleaseTag "${{ inputs.lightbug_envelope_release_tag }}" \
              --arg envelopeAsset "${{ inputs.lightbug_envelope_asset }}" \
              --arg envelopeUrl "${{ inputs.lightbug_envelope_url }}" \
              '[{name: $name, path: $path, version: $version, chip: $chip, firmwareVersion: $firmwareVersion, envelopeReleaseTag: $envelopeReleaseTag, envelopeAsset: $envelopeAsset, envelopeUrl: $envelopeUrl}]')
          else
            # Expand each application into the firmware profiles it supports.
            MATRIX_JSON=$(jq -c '
              . as $config |
              [
                $config.variants[] as $variant |
                $variant.profiles[] as $profile |
                $config.firmware_profiles[$profile] as $firmware |
                ($variant + $firmware + {firmwareVersion: "", envelopeUrl: ""} | del(.profiles))
              ]
            ' .github/variants.json)
          fi
          
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build:
    name: Build Artifacts
    needs: [test, prepare-matrix]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Toit
        if: matrix.chip != 'esp32s31'
        uses: toitlang/action-setup@v1.5.0
        with:
          toit-version: ${{ matrix.version }}

      - name: Download matching S31 envelope and SDK
        if: matrix.chip == 'esp32s31'
        env:
          ENVELOPE_RELEASE_TAG: ${{ matrix.envelopeReleaseTag }}
          TOIT_REF: ${{ matrix.version }}
        run: |
          if [[ ! "$ENVELOPE_RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::S31 envelope release tag must use letters, digits, dots, underscores or hyphens."
            exit 1
          fi
          mkdir -p build/s31-input
          cd build/s31-input
          BASE_URL="https://github.com/lightbug-io/toit-envelopes/releases/download/$ENVELOPE_RELEASE_TAG"
          for asset in alpha.esp32s31-single-ota-4mb.envelope \
            alpha.esp32s31-sdk-linux-x64.tar.gz alpha.esp32s31-build.json \
            alpha.esp32s31-SHA256SUMS; do
            curl --fail --location --retry 3 --output "$asset" "$BASE_URL/$asset"
          done
          sha256sum --check alpha.esp32s31-SHA256SUMS
          jq -e --arg ref "$TOIT_REF" \
            '.experimental == true and .variant == "esp32s31-single-ota-4mb"
            and .asset == "alpha.esp32s31-single-ota-4mb.envelope"
            and .toit_repository == "addshore/toit"
            and .toit_ref == $ref
            and (.toit_ref | test("^[0-9a-f]{40}$"))' alpha.esp32s31-build.json

      - name: Set up matching experimental Toit SDK
        if: matrix.chip == 'esp32s31'
        run: |
          mkdir -p build/s31-sdk
          tar -xzf build/s31-input/alpha.esp32s31-sdk-linux-x64.tar.gz -C build/s31-sdk
          echo "$GITHUB_WORKSPACE/build/s31-sdk/sdk/bin" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: toit pkg install

      # TODO it would be nice to abstract this away via the Makefiles...
      - name: Install Example Dependencies
        run: |
          pushd examples
          toit pkg install
          popd

      - name: Build Snapshot and Envelope
        id: build
        env:
          LIGHTBUG_ENVELOPE_FILE: ${{ matrix.chip == 'esp32s31' && 'build/s31-input/alpha.esp32s31-single-ota-4mb.envelope' || '' }}
        run: |
          chmod +x build/build.sh
          FIRMWARE_VERSION="${{ matrix.firmwareVersion }}"
          if [ -z "$FIRMWARE_VERSION" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            FIRMWARE_VERSION="${GITHUB_REF_NAME}"
          fi
          LIGHTBUG_ENVELOPE_RELEASE_TAG="${{ matrix.envelopeReleaseTag }}" \
          LIGHTBUG_ENVELOPE_ASSET="${{ matrix.envelopeAsset }}" \
          LIGHTBUG_ENVELOPE_URL="${{ matrix.envelopeUrl }}" \
          LIGHTBUG_FIRMWARE_VERSION="$FIRMWARE_VERSION" \
          LIGHTBUG_FIRMWARE_VARIANT="${{ matrix.firmwareVariant || matrix.name }}" \
          ./build/build.sh "${{ matrix.name }}.${{ matrix.artifact_suffix }}" "${{ matrix.path }}" "${{ matrix.version }}" "${{ matrix.chip }}"

      - name: Validate full 4 MiB S31 flash image
        if: matrix.chip == 'esp32s31'
        env:
          SNAPSHOT_NAME: ${{ matrix.name }}.${{ matrix.artifact_suffix }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          name = os.environ["SNAPSHOT_NAME"]
          image = Path(f"build/out/{name}/{name}.image.bin").read_bytes()
          if len(image) != 4 * 1024 * 1024:
              raise SystemExit(f"Expected a 4 MiB image, got {len(image)} bytes")
          # S31 boots at 0x2000; the single OTA slot is aligned to 0x10000.
          for part, offset in [("bootloader", 0x2000), ("application", 0x10000)]:
              if image[offset] != 0xE9:
                  raise SystemExit(f"Missing ESP image header for {part}")
              chip_id = int.from_bytes(image[offset + 12:offset + 14], "little")
              if chip_id != 0x20:
                  raise SystemExit(f"Expected ESP32-S31 {part}, got chip ID {chip_id}")
              if image[offset + 3] >> 4 != 2:
                  raise SystemExit(f"Expected 4 MiB flash header for {part}")
          print("Validated 4 MiB ESP32-S31 image including bootloader and application")
          PY
          cp build/s31-input/alpha.esp32s31-build.json "build/out/$SNAPSHOT_NAME/"
          cd "build/out/$SNAPSHOT_NAME"
          sha256sum ./*.snapshot ./*.envelope ./*.bin alpha.esp32s31-build.json > alpha.esp32s31-SHA256SUMS

      - name: Upload Artifacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-${{ matrix.artifact_suffix }}-artifacts
          path: build/out/${{ matrix.name }}.${{ matrix.artifact_suffix }}/

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Unpack downloaded artifacts
        run: |
          shopt -s nullglob
          for archive in artifacts/*.zip; do
            unzip -o "$archive" -d artifacts
          done
          rm -f artifacts/*.zip

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
