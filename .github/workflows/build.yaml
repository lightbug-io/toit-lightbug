name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      snapshot_name:
        description: 'Snapshot Name'
        required: true
        default: 'custom-app'
      target_file:
        description: 'Target Toit File'
        required: true
        default: 'examples/geofence.toit'
      toit_version:
        description: 'Toit Version'
        required: true
        default: 'v2.0.0-alpha.198'
      firmware_type:
        description: 'Firmware Type'
        required: true
        default: 'esp32c6'
      firmware_version:
        description: 'Firmware semver to embed (for example 0.18.0)'
        required: true
        default: '0.0.0'
      lightbug_envelope_release_tag:
        description: 'Lightbug envelope GitHub release tag'
        required: true
        default: 'lb.20260819-1'
      lightbug_envelope_asset:
        description: 'Envelope asset name in that release'
        required: true
        default: 'esp32c6-single-ota.198.envelope'
      lightbug_envelope_url:
        description: 'Optional full URL to download a custom envelope'
        required: false
        default: ''

jobs:
  test:
    name: Run Tests / Toit ${{ matrix.toit_version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toit_version:
          - v2.0.0-alpha.191
          - v2.0.0-alpha.198
    steps:
      - uses: actions/checkout@v7
      - uses: toitlang/action-setup@v1.4.0
        with:
          toit-version: ${{ matrix.toit_version }}
      - run: make test
      - name: Analyze examples
        run: |
          if [ "${{ matrix.toit_version }}" = "v2.0.0-alpha.191" ]; then
              make analyze-examples TOIT=toit TOIT_PKG="toit pkg" ANALYZE_EXCLUDE="examples/containers/base.toit examples/toit/usb_console_smoke_test.toit examples/toit/usb_console_v3.toit examples/host/heartbeat.toit examples/host/info.toit examples/host/qc.toit"
          else
            make analyze-examples TOIT=toit TOIT_PKG="toit pkg"
          fi

  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Construct JSON for manual dispatch
            MATRIX_JSON=$(jq -n -c \
              --arg name "${{ inputs.snapshot_name }}" \
              --arg path "${{ inputs.target_file }}" \
              --arg version "${{ inputs.toit_version }}" \
              --arg chip "${{ inputs.firmware_type }}" \
              --arg firmwareVersion "${{ inputs.firmware_version }}" \
              --arg envelopeReleaseTag "${{ inputs.lightbug_envelope_release_tag }}" \
              --arg envelopeAsset "${{ inputs.lightbug_envelope_asset }}" \
              --arg envelopeUrl "${{ inputs.lightbug_envelope_url }}" \
              '[{name: $name, path: $path, version: $version, chip: $chip, firmwareVersion: $firmwareVersion, envelopeReleaseTag: $envelopeReleaseTag, envelopeAsset: $envelopeAsset, envelopeUrl: $envelopeUrl}]')
          else
            # Expand each application into the firmware profiles it supports.
            MATRIX_JSON=$(jq -c '
              . as $config |
              [
                $config.variants[] as $variant |
                $variant.profiles[] as $profile |
                $config.firmware_profiles[$profile] as $firmware |
                ($variant + $firmware + {firmwareVersion: "", envelopeUrl: ""} | del(.profiles))
              ]
            ' .github/variants.json)
          fi
          
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build:
    name: Build Artifacts
    needs: [test, prepare-matrix]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Toit
        uses: toitlang/action-setup@v1.4.0
        with:
          toit-version: ${{ matrix.version }}

      - name: Install Dependencies
        run: toit pkg install

      # TODO it would be nice to abstract this away via the Makefiles...
      - name: Install Example Dependencies
        run: |
          pushd examples
          toit pkg install
          popd

      - name: Build Snapshot and Envelope
        id: build
        run: |
          chmod +x build/build.sh
          FIRMWARE_VERSION="${{ matrix.firmwareVersion }}"
          if [ -z "$FIRMWARE_VERSION" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            FIRMWARE_VERSION="${GITHUB_REF_NAME}"
          fi
          LIGHTBUG_ENVELOPE_RELEASE_TAG="${{ matrix.envelopeReleaseTag }}" \
          LIGHTBUG_ENVELOPE_ASSET="${{ matrix.envelopeAsset }}" \
          LIGHTBUG_ENVELOPE_URL="${{ matrix.envelopeUrl }}" \
          LIGHTBUG_FIRMWARE_VERSION="$FIRMWARE_VERSION" \
          ./build/build.sh "${{ matrix.name }}.${{ matrix.artifact_suffix }}" "${{ matrix.path }}" "${{ matrix.version }}" "${{ matrix.chip }}"

      - name: Upload Artifacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-artifacts
          path: build/out/${{ matrix.name }}/

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Unpack downloaded artifacts
        run: |
          shopt -s nullglob
          for archive in artifacts/*.zip; do
            unzip -o "$archive" -d artifacts
          done
          rm -f artifacts/*.zip

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
